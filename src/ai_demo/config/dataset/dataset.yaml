# VisionDrive3D dataset config.
# Used by: src/ai_demo/train.py, evaluate.py, inference.py, benchmark_zero_shot.py
# Run: conda run -n vd3d-ai python src/ai_demo/train.py --dataset-config src/ai_demo/config/dataset/dataset.yaml
dataset_root: output_dataset
images_dir: output_dataset/images
labels_yolo_dir: output_dataset/labels/yolo
imagesets:
  train: output_dataset/ImageSets/train.txt
  val: output_dataset/ImageSets/val.txt
  test: output_dataset/ImageSets/test.txt
# Ultralytics-style dataset yaml (auto-generated by train.py if missing).
yolo_yaml: output_dataset/dataset.yaml
# Single-class car detection (YOLO txt class 0, COCO 'car').
nc: 1
names:
  - car
imgsz: 640
seed: 42
